<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webseite nicht verfügbar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Scrollen deaktiviert */
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: table;
        }

        .wrapper {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            padding: 5vw;
        }

        .container {
            display: inline-block;
            max-width: 90vw;
            width: 100%;
        }

        .icon-container {
            margin: 0 auto 3vh auto;
            /* Flexibel angepasst & kleiner gemacht */
            width: clamp(48px, 12vw, 75px);
            height: clamp(48px, 12vw, 75px);
        }

        .svg-icon {
            width: 100%;
            height: 100%;
            display: block;
        }

        h1 {
            color: #1a1a1a;
            /* Passt sich der Bildschirmgröße an */
            font-size: clamp(18px, 4vw, 26px);
            font-weight: 600;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            <div class="icon-container">
                <svg class="svg-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Roter Kreis -->
                    <circle cx="50" cy="50" r="44" stroke="#e53e3e" stroke-width="7" fill="none"/>
                    <!-- Rotes X -->
                    <path d="M38 38 L62 62 M62 38 L38 62" stroke="#e53e3e" stroke-width="7" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>Diese Webseite ist nicht mehr verfügbar</h1>
        </div>
    </div>

</body>
</html>
